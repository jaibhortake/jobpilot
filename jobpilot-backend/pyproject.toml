[project]
name = "jobpilot-backend"
version = "0.1.0"
description = "JobPilot API: personal job discovery, ranking and application materials"
requires-python = ">=3.12,<3.13"
dependencies = [
    "alembic>=1.13,<2",
    "ddgs>=9",
    "dynaconf>=3.2,<4",
    "fastapi>=0.115,<1",
    "httpx>=0.27,<1",
    "litellm>=1.98",
    "openpyxl>=3.1,<4",
    "playwright>=1.48,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.9,<3",
    "python-multipart>=0.0.9",
    "sqlalchemy>=2.0,<3",
    "tldextract>=5",
    "uvicorn[standard]>=0.30,<1",
]

[dependency-groups]
dev = [
    "mypy>=1.11,<2",
    "pytest>=8.3,<9",
    "pytest-asyncio>=0.24,<1",
    "respx>=0.21,<1",
    "ruff>=0.6,<1",
]

[tool.uv]
package = false

[tool.mypy]
strict = true
disallow_untyped_defs = true
warn_return_any = true
no_implicit_optional = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["dynaconf.*", "litellm.*", "ddgs.*", "tldextract.*", "openpyxl.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["UP047"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.File", "fastapi.Body"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
testpaths = ["tests"]
markers = [
    "seam: real Postgres via TEST_DATABASE_URL, no mocks of our own code",
    "browser: real Chromium via Playwright",
    "live: real external sites or LLM providers (manual)",
]
addopts = "-m 'not live and not browser'"

[[tool.mypy.overrides]]
module = ["litellm.*"]
implicit_reexport = true
